<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWE Delivery Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<div class="wrap">
  <header class="mast">
    <div><h1>RWE Delivery Survey</h1><p>Call centre form for the Meesho and doorstep delivery survey</p></div>
    <img class="logo" alt="Frontier Markets" src="logo.png">
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-t="form" aria-selected="true">Call form</button>
    <button role="tab" data-t="tracker" aria-selected="false" hidden>Call tracker</button>
    <button role="tab" data-t="results" aria-selected="false" hidden>Survey results</button>
    <span class="sp"></span>
    <label class="who">Caller <select id="who"></select></label>
  </nav>
  <div id="banner"></div>
  <div id="importbar"></div>

  <section class="view on" id="v-form">
    <div class="callgrid">
      <aside class="queue">
        <div class="qh">
          <h2>Call list</h2>
          <div class="seg" id="mode" role="group" aria-label="Who are you calling" style="margin-bottom:8px">
            <button type="button" data-m="rwe" aria-pressed="true">RWEs (Sahelis)</button>
            <button type="button" data-m="hh" aria-pressed="false">Households by village</button>
          </div>
          <div class="qf">
            <label class="ctl"><span>State</span><select id="q-state"></select></label>
            <label class="ctl"><span>District</span><select id="q-dist"></select></label>
            <label class="ctl full" data-for="rwe"><span>MAT</span><select id="q-mat"></select></label>
            <label class="ctl" data-for="rwe"><span>RWE category</span><select id="q-cat"></select></label>
            <label class="ctl"><span>Show</span><select id="q-st"></select></label>
            <label class="ctl full" data-for="rwe"><span>RWE profile</span><select id="q-shop"></select></label>
            <label class="ctl full"><span id="q-slab">Find by RWE ID or name</span><input id="q-s" type="search" autocomplete="off" placeholder="e.g. 2019022"></label>
          </div>
        </div>
        <div class="qmeta" id="q-meta"></div>
        <div class="qlist" id="q-list"></div>
      </aside>
      <div id="sheet"></div>
    </div>
  </section>

  <section class="view" id="v-tracker">
    <div class="head"><h2>Call tracker</h2><p class="headline" id="t-head"></p></div>
    <div class="flt" id="t-flt"></div>
    <div id="t-body"></div>
  </section>

  <section class="view" id="v-results">
    <div class="head"><h2>Survey results</h2><p class="headline" id="r-head"></p></div>
    <div class="flt" id="r-flt"></div>
    <div id="r-body"></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>
<script>window.ROLE='form';</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
